<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="45%" stop-color="#1d58d9" />
      <stop offset="100%" stop-color="#0f2b6e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Outer Border Accent -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Shield Shape Frame -->
  <g filter="url(#dropShadow)">
    <path d="M256 70 C330 70 400 95 400 130 C400 270 330 385 256 440 C182 385 112 270 112 130 C112 95 182 70 256 70 Z" 
          fill="#ffffff" fill-opacity="0.08" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round" />
  </g>

  <!-- Central Emblem: Payroll & University Monogram (SLSU + Peso & Growth Chart) -->
  <!-- University Pillar / Arch Lines -->
  <path d="M190 140 L322 140 M256 125 L256 140" stroke="#fde047" stroke-width="5" stroke-linecap="round" />
  <polygon points="256,105 170,140 342,140" fill="url(#goldGrad)" />

  <!-- Stylized Peso & Calculation Node Structure -->
  <g transform="translate(256, 275)" filter="url(#dropShadow)">
    <!-- Shield Center Circle -->
    <circle cx="0" cy="0" r="105" fill="#0f2356" stroke="#fde047" stroke-width="4" />
    
    <!-- Outer Orbit Ring -->
    <circle cx="0" cy="0" r="92" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />

    <!-- Philippine Peso Sign '₱' in bold, clean geometric display -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="110" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">
      ₱
    </text>

    <!-- Star Badges around Center -->
    <path d="M 0 -72 L 4 -62 L 14 -62 L 6 -55 L 9 -45 L 0 -51 L -9 -45 L -6 -55 L -14 -62 L -4 -62 Z" fill="#fde047" />
    <path d="M -58 45 L -54 55 L -44 55 L -52 62 L -49 72 L -58 66 L -67 72 L -64 62 L -72 55 L -62 55 Z" fill="#fde047" />
    <path d="M 58 45 L 62 55 L 72 55 L 64 62 L 67 72 L 58 66 L 49 72 L 52 62 L 44 55 L 54 55 Z" fill="#fde047" />
  </g>

  <!-- Bottom Brand Ribbon Banner -->
  <g transform="translate(256, 445)">
    <rect x="-140" y="-22" width="280" height="42" rx="21" fill="#0b193d" stroke="#fde047" stroke-width="2.5" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="4">
      SLSU PAYROLL
    </text>
  </g>
</svg>
