    <script>
      // Filter benign Vite websocket reconnection notifications in sandboxed container preview
      (function() {
        if (typeof window !== 'undefined') {
          const origConsoleError = console.error;
          console.error = function(...args) {
            if (args.length > 0 && typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].includes('websocket'))) {
              console.debug(...args);
              return;
            }
            origConsoleError.apply(console, args);
          };
        }
      })();
    </script>
